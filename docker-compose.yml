services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediation
      POSTGRES_USER: mediation
      POSTGRES_PASSWORD: mediation-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediation -d mediation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3mock:
    image: motoserver/moto:latest
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 5000), timeout=2).close()
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:5000:5000"

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3mock:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://s3mock:5000 s3api head-bucket --bucket mediation-documents >/dev/null 2>&1 || aws --endpoint-url http://s3mock:5000 s3api create-bucket --bucket mediation-documents --create-bucket-configuration LocationConstraint=us-west-2
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mediation:mediation-dev-only@db:5432/mediation
      S3_BUCKET: mediation-documents
      S3_REGION: us-west-2
      S3_ENDPOINT_URL: http://s3mock:5000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      MAX_UPLOAD_BYTES: 20971520
      MAX_PDF_PAGES: 200
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: local-demo-only-signing-secret-not-for-production-123
      AUTH_ISSUER: http://localhost:8000
      AUTH_PUBLIC_BASE_URL: http://localhost:8000
      AUTH_COOKIE_SECURE: "true"
      DEMO_MODE_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres-data:
