services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediation
      POSTGRES_USER: mediation
      POSTGRES_PASSWORD: mediation-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediation -d mediation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3mock:
    image: motoserver/moto:latest
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 5000), timeout=2).close()
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:5000:5000"

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3mock:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DELETION_LEDGER_BUCKET: ${DELETION_LEDGER_BUCKET:-mediation-deletion-ledger}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (aws --endpoint-url http://s3mock:5000 s3api head-bucket --bucket mediation-documents >/dev/null 2>&1 || aws --endpoint-url http://s3mock:5000 s3api create-bucket --bucket mediation-documents --create-bucket-configuration LocationConstraint=us-west-2)
        && (aws --endpoint-url http://s3mock:5000 s3api head-bucket --bucket "$DELETION_LEDGER_BUCKET" >/dev/null 2>&1 || aws --endpoint-url http://s3mock:5000 s3api create-bucket --bucket "$DELETION_LEDGER_BUCKET" --create-bucket-configuration LocationConstraint=us-west-2)
        && aws --endpoint-url http://s3mock:5000 s3api put-bucket-versioning --bucket "$DELETION_LEDGER_BUCKET" --versioning-configuration Status=Enabled
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mediation:mediation-dev-only@db:5432/mediation
      S3_BUCKET: ${S3_BUCKET:-mediation-documents}
      DELETION_LEDGER_BUCKET: ${DELETION_LEDGER_BUCKET:-mediation-deletion-ledger}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:5000}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-2}
      MAX_UPLOAD_BYTES: 20971520
      MAX_PDF_PAGES: 200
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-demo-only-signing-secret-not-for-production-123}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8000}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8000}
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      OWNER_BETA_ENABLED: "${OWNER_BETA_ENABLED:-false}"
      OWNER_BETA_EMAIL: ${OWNER_BETA_EMAIL:-}
      OWNER_BETA_READINESS_REQUIRED: "${OWNER_BETA_READINESS_REQUIRED:-false}"
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_ATTEMPT_CREDITS_5: ${STRIPE_PRICE_ID_ATTEMPT_CREDITS_5:-}
      STRIPE_PRICE_ID_ATTEMPT_CREDITS_10: ${STRIPE_PRICE_ID_ATTEMPT_CREDITS_10:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Casework}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8000}
      DEMO_MODE_ENABLED: "${DEMO_MODE_ENABLED:-true}"
      CASE_DATA_ENABLED: "${CASE_DATA_ENABLED:-false}"
      CASE_MATERIALS_ENABLED: "${CASE_MATERIALS_ENABLED:-false}"
      PRODUCTION_READINESS_REQUIRED: "${PRODUCTION_READINESS_REQUIRED:-false}"
      OWNER_BETA_READINESS_REQUIRED: "${OWNER_BETA_READINESS_REQUIRED:-false}"
      AI_ANALYSIS_ENABLED: "${AI_ANALYSIS_ENABLED:-false}"
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      AI_ANALYSIS_NOTICE_VERSION: ${AI_ANALYSIS_NOTICE_VERSION:-}
      AI_ANALYSIS_DATA_HANDLING_NOTICE: ${AI_ANALYSIS_DATA_HANDLING_NOTICE:-}
      SETTLEMENT_PLANNING_DATA_HANDLING_NOTICE: ${SETTLEMENT_PLANNING_DATA_HANDLING_NOTICE:-}
    depends_on:
      db:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "192.168.1.17:8001:8000"

  extraction-worker:
    build: .
    command: ["python", "-m", "app.extraction_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://mediation:mediation-dev-only@db:5432/mediation
      S3_BUCKET: ${S3_BUCKET:-mediation-documents}
      DELETION_LEDGER_BUCKET: ${DELETION_LEDGER_BUCKET:-mediation-deletion-ledger}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:5000}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-2}
      MAX_UPLOAD_BYTES: 20971520
      MAX_PDF_PAGES: 200
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-demo-only-signing-secret-not-for-production-123}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8000}
      DEMO_MODE_ENABLED: "${DEMO_MODE_ENABLED:-true}"
      CASE_DATA_ENABLED: "${CASE_DATA_ENABLED:-false}"
      CASE_MATERIALS_ENABLED: "${CASE_MATERIALS_ENABLED:-false}"
      OWNER_BETA_READINESS_REQUIRED: "${OWNER_BETA_READINESS_REQUIRED:-false}"
      AI_ANALYSIS_ENABLED: "${AI_ANALYSIS_ENABLED:-false}"
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      AI_ANALYSIS_NOTICE_VERSION: ${AI_ANALYSIS_NOTICE_VERSION:-}
      AI_ANALYSIS_DATA_HANDLING_NOTICE: ${AI_ANALYSIS_DATA_HANDLING_NOTICE:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  analysis-worker:
    build: .
    command: ["python", "-m", "app.analysis_worker"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-mediation-documents}
      DELETION_LEDGER_BUCKET: ${DELETION_LEDGER_BUCKET:-mediation-deletion-ledger}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:5000}
      DATABASE_URL: postgresql+psycopg://mediation:mediation-dev-only@db:5432/mediation
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-2}
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-demo-only-signing-secret-not-for-production-123}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      DEMO_MODE_ENABLED: "${DEMO_MODE_ENABLED:-true}"
      CASE_DATA_ENABLED: "${CASE_DATA_ENABLED:-false}"
      CASE_MATERIALS_ENABLED: "${CASE_MATERIALS_ENABLED:-false}"
      OWNER_BETA_READINESS_REQUIRED: "${OWNER_BETA_READINESS_REQUIRED:-false}"
      AI_ANALYSIS_ENABLED: "${AI_ANALYSIS_ENABLED:-false}"
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      AI_ANALYSIS_NOTICE_VERSION: ${AI_ANALYSIS_NOTICE_VERSION:-}
      AI_ANALYSIS_DATA_HANDLING_NOTICE: ${AI_ANALYSIS_DATA_HANDLING_NOTICE:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
