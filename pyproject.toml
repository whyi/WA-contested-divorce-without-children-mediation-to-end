[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-mediation-wizard"
version = "0.1.0"
description = "Document workflow foundation for a Washington State mediation-to-decree wizard"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "cryptography>=42,<46",
    "docx2pdf>=0.1.8,<0.2",
    "docxtpl>=0.16,<1",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "lxml>=5,<7",
    "openpyxl>=3.1,<4",
    "pdf2docx>=0.5.8,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pyotp>=2.9,<3",
    "PyJWT[crypto]>=2.8,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pypdf>=4,<7",
    "pymupdf>=1.24,<2",
    "psycopg[binary]>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "stripe>=10,<15",
    "uvicorn[standard]>=0.29,<1",
    "webauthn>=2,<3",
    "email-validator>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["static/*.html"]
