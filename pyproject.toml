[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-mediation-wizard"
version = "0.1.0"
description = "Document workflow foundation for a Washington State mediation-to-decree wizard"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "docx2pdf>=0.1.8,<0.2",
    "docxtpl>=0.16,<1",
    "fastapi>=0.110,<1",
    "jinja2>=3.1,<4",
    "lxml>=5,<7",
    "pdf2docx>=0.5.8,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pypdf>=4,<7",
    "pymupdf>=1.24,<2",
    "psycopg[binary]>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["static/*.html"]
