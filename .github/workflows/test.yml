name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  entry-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uat/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci
      - name: Check UAT safety and runner compatibility
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Enforce signed-in entry contract
        run: npm run entry

  test:
    runs-on: ubuntu-latest
    outputs:
      coverage-ready: ${{ steps.coverage_report.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e . coverage

      - name: Run validation with coverage
        id: validation
        continue-on-error: true
        env:
          COVERAGE: "1"
        run: bash harness/validate.sh

      - name: Generate coverage report
        id: coverage_report
        if: always() && steps.validation.outcome != 'skipped'
        run: coverage json -o "$RUNNER_TEMP/coverage.json"

      - uses: actions/upload-artifact@v4
        if: steps.coverage_report.outcome == 'success'
        with:
          name: coverage-json
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: error

      - name: Fail if validation failed
        if: steps.validation.outcome == 'failure'
        run: exit 1

  update-coverage-badge:
    needs: test
    if: always() && needs.test.outputs.coverage-ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-json
          path: .coverage-report

      - name: Update coverage badge
        run: |
          python - .coverage-report/coverage.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as coverage_file:
              percentage = round(json.load(coverage_file)["totals"]["percent_covered"])

          color = "#4c1" if percentage >= 90 else "#97ca00" if percentage >= 75 else "#dfb317" if percentage >= 60 else "#e05d44"
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="118" height="20" role="img" aria-label="coverage: {percentage}%">
            <title>coverage: {percentage}%</title>
            <linearGradient id="b" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <clipPath id="a"><rect width="118" height="20" rx="3"/></clipPath>
            <g clip-path="url(#a)"><path fill="#555" d="M0 0h62v20H0z"/><path fill="{color}" d="M62 0h56v20H62z"/><path fill="url(#b)" d="M0 0h118v20H0z"/></g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="31" y="15">coverage</text><text x="89" y="15">{percentage}%</text></g>
          </svg>
          '''
          with open("coverage.svg", "w", encoding="utf-8") as badge:
              badge.write(svg)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.svg
          if ! git diff --cached --quiet; then
            measured_revision="$(git rev-parse HEAD)"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$measured_revision" ]]; then
              echo "::notice::Skipping outdated coverage badge: main changed during measurement."
              exit 0
            fi
            git commit -m "Update coverage badge"
            if ! git push origin HEAD:main; then
              git fetch origin main
              if [[ "$(git rev-parse origin/main)" != "$measured_revision" ]]; then
                echo "::notice::Skipping outdated coverage badge: main changed during publication."
                exit 0
              fi
              echo "::error::Coverage badge push failed without a concurrent main update."
              exit 1
            fi
          fi
