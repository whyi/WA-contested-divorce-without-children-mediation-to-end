services:
  local-https:
    image: nginx:stable-alpine
    ports:
      - "192.168.1.17:8443:443"
    volumes:
      - ./deploy/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local-tls:/etc/nginx/local-tls:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
